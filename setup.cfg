; SQLAlchemy compliance test suite configuration.
;
; The SA pytest plugin (loaded via ``conftest.py``'s ``pytest_plugins``)
; reads this file at session start. ``setup.cfg`` is the canonical
; location SA's plugin checks; ``pyproject.toml`` is not consulted by
; the plugin's own config-loader.
;
; The matching ``provision.py`` and ``requirements.py`` modules live
; under ``src/sqlalchemydqlite/``.
;
; Runtime override: pass ``--dburi=...`` on the pytest command line to
; point the suite at a different cluster.

[sqla_testing]
; The Requirements class the SA suite consults via
; ``requirements.<name>.enabled``. Each ``exclusions.open()`` /
; ``exclusions.closed()`` declaration in this class gates a subset of
; the standard SA suite.
requirement_cls = sqlalchemydqlite.requirements:Requirements

; Profile-stats output path. SA's profiling tests write here; benign
; for the standard suite (no profiling tests will fire without
; explicit opt-in).
profile_file = test/profiles.txt

[db]
; Default cluster URL. Tests can override with ``--dburi``. The default
; targets the ``python-dqlite-dev`` test cluster: 3 nodes on host
; networking at ``localhost:9001-9003`` (canonical dqlite ports).
default = dqlite://localhost:9001/default
dqlite = dqlite://localhost:9001/default
dqlite_aio = dqlite+aio://localhost:9001/default
